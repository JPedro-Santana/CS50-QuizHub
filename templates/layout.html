<!DOCTYPE html>
<html lang="{{ current_locale }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizHub{% endblock %} | QuizHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block style %}{% endblock %}
    <link rel="shortcut icon" href="{{url_for('static', filename='QuizHub.ico')}}" type="image/x-icon">
</head>

<body>
    <nav>
        <a href="{{url_for('index')}}"><img src="{{url_for('static', filename='images/QuizHub Logo Light.png')}}"
                alt="QuizHub Logo" class="logo"></a>
        <div class="nav-right">
            <ul>
                <li><a href="{{url_for('explore')}}">{{ _("Explore Quizzes") }}</a></li>
                <li><a href="{{url_for('create')}}">{{ _("Create Quiz") }}</a></li>
            </ul>
            <div class="lang-dropdown">
                <button class="lang-btn" type="button" id="langDropdownBtn" aria-label="{{ _('Change Language') }}">
                    {% for lang in languages %}
                    {% if lang.code == current_locale %}
                    <span class="lang-flag">{{ lang.flag }}</span>
                    <span class="lang-text">{{ lang.name }}</span>
                    {% endif %}
                    {% endfor %}
                    <span class="lang-caret">▾</span>
                </button>
                <div class="lang-menu" id="langMenu">
                    {% for lang in languages %}
                    <a href="{{ url_for('set_language', lang=lang.code) }}"
                        class="lang-item {% if lang.code == current_locale %}active{% endif %}">
                        <span class="lang-flag">{{ lang.flag }}</span>
                        <span class="lang-name">{{ lang.name }}</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    <footer>
        <h2 class="name-logo"><a href="https://github.com/JPedro-Santana" target="_blank">João Pedro Santana &copy;
                2026</a></h2>
        <a href="https://github.com/JPedro-Santana/Quiz" target="_blank"><img
                src="/static/images/GitHub_Invertocat_White.png" alt="Github Logo" class="github-logo"></a>
    </footer>

    <script id="i18n-data" type="application/json">
      {
        "multipleChoice": {{ _("Multiple Choices") | tojson }},
        "trueFalse": {{ _("True or False") | tojson }},
        "openAnswer": {{ _("Open Answer") | tojson }},
        "clickOptionHint": {{ _("Click an option to mark it as correct") | tojson }},
        "clickBoolHint": {{ _("Click to select the correct answer") | tojson }},
        "optionPlaceholder": {{ _("Option") | tojson }},
        "requiredSuffix": {{ _("(required)") | tojson }},
        "trueLabel": {{ _("True") | tojson }},
        "falseLabel": {{ _("False") | tojson }},
        "correctAnswerLabel": {{ _("Correct answer:") | tojson }},
        "typeCorrectAnswerPlaceholder": {{ _("Type the correct answer…") | tojson }},
        "errAdd2Options": {{ _("please add at least 2 options.") | tojson }},
        "errMarkCorrectOption": {{ _("click one option to mark it as the correct answer (green border).") | tojson }},
        "errProvideCorrectAnswer": {{ _("please provide the correct answer.") | tojson }},
        "errSelectTrueFalse": {{ _("please select True or False as the correct answer.") | tojson }},
        "errAddAtLeastOneQuestion": {{ _("Add at least one question before saving.") | tojson }},
        "questionLabel": {{ _("Question") | tojson }}
      }
    </script>
    <script>
        const i18nEl = document.getElementById('i18n-data');
        window.I18N = i18nEl ? JSON.parse(i18nEl.textContent) : {};

        // Language dropdown toggle
        const langBtn = document.getElementById('langDropdownBtn');
        const langMenu = document.getElementById('langMenu');
        if (langBtn && langMenu) {
            langBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                langMenu.classList.toggle('show');
            });
            document.addEventListener('click', () => {
                langMenu.classList.remove('show');
            });
        }
    </script>
</body>

</html>
